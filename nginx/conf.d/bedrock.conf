# NetherNet signaling shares TCP 443 with HTTPS and Java Minecraft.
server {
    listen 127.0.0.1:8444 proxy_protocol default_server;
    server_name _;
    return 404;
}
server {
    listen 127.0.0.1:8444 proxy_protocol;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    server_name np.hanasand.com;
    ssl_certificate /etc/letsencrypt/live/hanasand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hanasand.com/privkey.pem;

    location /v1/join {
        proxy_pass http://127.0.0.1:19132;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    location / { return 404; }
}
